name: Dev CI

on:
  push:
    branches:
      - dev
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "config.yaml"
      - "index.html"
      - "Trunk.toml"
      - "assets/**"
      - ".github/workflows/dev-ci.yml"
  pull_request:
    branches:
      - dev
      - main
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "config.yaml"
      - "index.html"
      - "Trunk.toml"
      - "assets/**"
      - ".github/workflows/dev-ci.yml"

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    container: rust:1.89
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y pkg-config libx11-dev libasound2-dev libudev-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libwayland-dev libxkbcommon-dev

      - name: Install Rust components
        shell: bash
        run: |
          rustup component add clippy

      - name: Run Clippy
        shell: bash
        run: |
          cargo clippy --all-targets -- -D warnings

      - name: Build Release
        shell: bash
        run: |
          cargo build --release

  wasm:
    name: WASM build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install Trunk
        run: cargo install --locked trunk --version 0.21.14
      - name: Build browser package
        run: trunk build --locked
      - name: Check experimental WebGPU build
        run: cargo check --locked --target wasm32-unknown-unknown --features webgpu
