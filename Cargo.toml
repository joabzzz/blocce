[package]
name = "blocce"
version = "0.1.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"

[features]
webgpu = ["bevy/webgpu"]

[dependencies]
bevy = "0.17.2"
rand = "0.8"
avian3d = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
opt-level = 2

# A separate profile keeps native release behavior while making the browser
# bundle small enough for static hosts with a 25 MiB per-file limit.
[profile.web-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = true
